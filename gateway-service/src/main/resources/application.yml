server:
  port: 8089

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      default-filters:
        - DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: soutenance-service
              uri: lb://soutenance-service
              predicates:
                - Path=/api/soutenances/**,/api/salles/**

            - id: jury-service
              uri: lb://jury-service
              predicates:
                - Path=/api/membres-jury/**,/api/affectations-jury/**

            - id: planning-service
              uri: lb://planning-service
              predicates:
                - Path=/api/planning/**

            - id: notes-service
              uri: lb://notes-service
              predicates:
                - Path=/api/evaluations/**,/api/resultats/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/users/internal/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
      cors:
        allowed-origins:
          - "http://localhost:3000"
          - "http://127.0.0.1:3000"
        allowed-methods: "*"
  endpoint:
    gateway:
      access: unrestricted
