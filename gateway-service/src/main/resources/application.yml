server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: soutenance-service
              uri: lb://soutenance-service
              predicates:
                - Path=/api/soutenances/**

            - id: jury-service
              uri: lb://jury-service
              predicates:
                - Path=/api/jurys/**

            - id: planning-service
              uri: lb://planning-service
              predicates:
                - Path=/api/planning/**

            - id: notes-service
              uri: lb://notes-service
              predicates:
                - Path=/api/notes/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted